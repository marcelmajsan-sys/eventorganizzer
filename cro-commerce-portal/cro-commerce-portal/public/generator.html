*{box-sizing:border-box}
:root{
  --navy:#0A2033; --navy2:#0E2F48; --line:#1d3b53;
  --yellow:#FBB116; --blue:#1E80C4; --muted:#8fa6ba;
}
html,body{margin:0;height:100%}
body{
  background:#071722; color:#e8f0f6;
  font:400 15px/1.5 Poppins,system-ui,sans-serif;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:14px;
  padding:14px 22px; border-bottom:1px solid var(--line); background:var(--navy);
}
header h1{font:700 16px/1 Poppins;margin:0;letter-spacing:.2px}
header span{color:var(--muted);font-size:13px}
main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
aside{
  border-right:1px solid var(--line); background:#0a1c2b;
  overflow:auto; padding:18px 20px 40px;
}
section{margin-bottom:26px}
h2{font:600 11px/1 Poppins;letter-spacing:1.4px;text-transform:uppercase;
   color:var(--muted);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input[type=text],textarea,select{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);
  background:#08202f;color:#e8f0f6;font:400 14px Poppins;
}
textarea{resize:vertical;min-height:64px}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
input[type=range]{width:100%;accent-color:var(--yellow)}
.rangewrap{display:flex;align-items:center;gap:10px}
.rangewrap b{font:500 12px Poppins;color:var(--muted);min-width:38px;text-align:right}
#drop{
  border:1.5px dashed #2b4c67;border-radius:10px;padding:16px;text-align:center;
  font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;
}
#drop.hot{border-color:var(--yellow);background:#0d2839;color:#e8f0f6}
#drop input{display:none}
#foto-ime{display:block;margin-top:8px;font-size:12px;color:#cfe0ee;word-break:break-all}
button{
  font:500 14px Poppins;border-radius:8px;border:1px solid var(--line);
  background:#0e2c40;color:#e8f0f6;padding:10px 14px;cursor:pointer;transition:.15s
}
button:hover:not(:disabled){background:#154158;border-color:#2b6a8d}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#12232f;font-weight:700}
button.primary:hover{background:#ffc23c;border-color:#ffc23c}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btnrow button{flex:1;min-width:130px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:#cfe0ee;cursor:pointer}
.checks input{accent-color:var(--yellow)}
#lista{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:240px;overflow:auto}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 10px}
.row strong{font:600 13px Poppins}
.row span{font-size:11px;color:var(--muted)}
.row.warn{border-color:#6b4a12}
.row.warn span{color:var(--yellow)}
#stage{display:flex;flex-direction:column;min-height:0;padding:18px 22px}
#tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px}
.tab strong{font:600 13px Poppins}
.tab span{font-size:11px;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue)}
.tab.on span{color:#d6ecfa}
#canvaswrap{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(45deg,#0c1c28 25%,transparent 25%) -10px 0/20px 20px,
    linear-gradient(-45deg,#0c1c28 25%,transparent 25%) -10px 0/20px 20px,
    linear-gradient(45deg,transparent 75%,#0c1c28 75%) 0 0/20px 20px,
    linear-gradient(-45deg,transparent 75%,#0c1c28 75%) 0 0/20px 20px,#0a1621;
  border:1px solid var(--line);border-radius:12px;padding:16px;
}
#preview{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;
         box-shadow:0 10px 40px rgba(0,0,0,.5)}
footer{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:13px;color:var(--muted)}
#status{color:var(--yellow);font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:900px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>

<header>
  <h1>CRO Commerce — generator kartica</h1>
  <span>13.10.2026. · sve se generira u pregledniku, ništa se ne šalje na server</span>
</header>

<main>
<aside>

  <section>
    <h2>Govornik</h2>
    <label for="ime">Ime i prezime</label>
    <input type="text" id="ime">
    <label for="tvrtka">Tvrtka</label>
    <input type="text" id="tvrtka">
    <label for="predavanje">Naslov predavanja</label>
    <textarea id="predavanje" placeholder="Trgovina 2030: Što će stvarati konkurentsku prednost kada svi imaju AI?"></textarea>
  </section>

  <section>
    <h2>Fotografija</h2>
    <div id="drop">
      <label for="foto" style="cursor:pointer;color:inherit;margin:0">
        Povuci fotografiju ovdje ili klikni
      </label>
      <input type="file" id="foto" accept="image/*">
      <span id="foto-ime">nema fotografije</span>
    </div>
    <label for="mode">Način smještaja</label>
    <select id="mode">
      <option value="auto">automatski</option>
      <option value="cutout">izrezan govornik (PNG bez pozadine)</option>
      <option value="fill">puna fotografija</option>
    </select>
    <label for="zoom">Zoom</label>
    <div class="rangewrap"><input type="range" id="zoom" min="0.6" max="2" step="0.01" value="1"><b>1.00</b></div>
    <label for="pomakx">Pomak lijevo / desno</label>
    <div class="rangewrap"><input type="range" id="pomakx" min="-0.5" max="0.5" step="0.01" value="0"><b>0.00</b></div>
    <label for="pomaky">Pomak gore / dolje</label>
    <div class="rangewrap"><input type="range" id="pomaky" min="-0.5" max="0.5" step="0.01" value="0"><b>0.00</b></div>
    <div class="btnrow"><button id="reset-foto">Ukloni fotografiju</button></div>
  </section>

  <section>
    <h2>Konferencija</h2>
    <label for="datum">Datum</label>
    <input type="text" id="datum">
    <label for="slogan">Natpis u podnožju</label>
    <input type="text" id="slogan">
  </section>

  <section>
    <h2>Izvoz</h2>

/* --------------------------------------------------------------- pomocno */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function fnt(weight, size) {
  return `${weight} ${Math.round(size)}px Poppins, sans-serif`;
}

function fitSize(ctx, text, weight, maxW, startFs, minFs) {
  let fs = startFs;
  while (fs > minFs) {
    ctx.font = fnt(weight, fs);
    if (ctx.measureText(text).width <= maxW) return fs;
    fs *= 0.97;
  }
  return minFs;
}

function wrapTo(ctx, text, weight, maxW, maxLines, startFs, minFs) {
  let fs = startFs;
  while (fs >= minFs) {
    ctx.font = fnt(weight, fs);
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const trial = cur ? cur + ' ' + w : w;
      if (ctx.measureText(trial).width <= maxW || !cur) cur = trial;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW))
      return { lines, fs };
    fs *= 0.94;
  }
  ctx.font = fnt(weight, minFs);
  return { lines: [text], fs: minFs };
}

function trackedText(ctx, text, x, y, track) {
  for (const ch of text) {
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width + track;
  }
}

function trackedWidth(ctx, text, track) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + track;
  return w - track;
}

/* ------------------------------------------------------------- pozadina */
function drawBackground(ctx, W, H) {
  // racunamo na maloj mrezi pa rastegnemo - gradijent je gladak, razlika se ne vidi
  const n = 160;
  const m = Math.max(2, Math.round(n * H / W));
  const off = document.createElement('canvas');
  off.width = n; off.height = m;
  const octx = off.getContext('2d');
  const img = octx.createImageData(n, m);
  const ratio = H / W;
  for (let j = 0; j < m; j++) {
    const ny = (j + 0.5) / m;
    for (let i = 0; i < n; i++) {
      const nx = (i + 0.5) / n;
      const d = Math.hypot(nx - 0.30, (ny - 0.58) * ratio);
      const g = Math.pow(Math.max(0, Math.min(1, 1 - d / 0.72)), 1.5);
      let dk = Math.pow(Math.max(0, Math.min(1, (nx - 0.42) / 0.58)), 1.3) * 0.85;
      dk = Math.max(dk,
        Math.max(0, Math.min(1, (nx - .55) / .45)) * Math.max(0, Math.min(1, (.45 - ny) / .45)));
      dk = Math.max(dk,
        Math.max(0, Math.min(1, (ny - .72) / .28)) * Math.max(0, Math.min(1, (nx - .55) / .45)) * .8);
      const p = (j * n + i) * 4;
      for (let c = 0; c < 3; c++) {
        let v = C.navyBase[c] + (C.navyGlow[c] - C.navyBase[c]) * g;
        v = v * (1 - dk) + C.navyDark[c] * dk;
        img.data[p + c] = Math.round(v);
      }
      img.data[p + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, W, H);
}

/* --------------------------------------------------------------- mreza */
function drawNetwork(ctx, W, H, seed) {
  const rnd = mulberry32(seed);
  const unit = Math.sqrt(W * H);
  ctx.save();

  ctx.lineWidth = Math.max(1, W / 1900);
  for (let i = 0; i < 6; i++) {
    const r = (0.055 + rnd() * 0.08) * unit;
    const cx = (-0.05 + rnd() * 1.1) * W, cy = (0.05 + rnd() * 0.95) * H;
    ctx.strokeStyle = `rgba(${C.netLine},0.10)`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }

  const n = Math.max(8, Math.round(unit / 30));
  const pts = [];
  let tries = 0;
  while (pts.length < n && tries < 8000) {
    tries++;
    const p = [(-0.02 + rnd() * 1.04) * W, (-0.02 + rnd() * 1.04) * H];
    if (pts.every(q => (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 > (0.115 * unit) ** 2))
      pts.push(p);
  }

  const link = 0.30 * unit;
  ctx.lineWidth = Math.max(1, W / 2200);
  for (let i = 0; i < pts.length; i++)
    for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
      if (d < link) {
        ctx.strokeStyle = `rgba(${C.netLine},${(0.13 * (1 - d / link) + 0.04).toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(pts[i][0], pts[i][1]);
        ctx.lineTo(pts[j][0], pts[j][1]);
        ctx.stroke();
      }
    }

  for (const p of pts) {
    const r = (0.0016 + rnd() * 0.0014) * unit;
    const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 8);
    g.addColorStop(0, `rgba(${C.netNode},0.30)`);
    g.addColorStop(1, `rgba(${C.netNode},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p[0], p[1], r * 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(${C.netNode},0.80)`;
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* --------------------------------------------------------------- avion */
function drawPlane(ctx, W, H, p) {
  const ax = p[0] * W, ay = p[1] * H;
  const ex = p[4] * W, yt = p[2] * H, yb = p[3] * H;
  const step = (ex - ax) * 0.012;
  const band = (f0, f1, colour, back) => {
    const y0 = yt + (yb - yt) * f0, y1 = yt + (yb - yt) * f1;
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(ex - back, y0); ctx.lineTo(ex - back, y1);
    ctx.closePath(); ctx.fill();
  };
  band(0, .46, C.planeHi, 0);
  band(.44, .76, C.planeMid, step);
  band(.74, 1, C.planeLow, step * 2.2);
}

/* ---------------------------------------------------------- fotografija */
function drawPhoto(ctx, W, H, box, img, mode, zoom, shiftX, shiftY) {
  const [x0, y0, x1, y1] = box;
  const bw = x1 - x0, bh = y1 - y0;
  if (mode === 'auto') mode = img.hasAlpha ? 'cutout' : 'fill';

  if (mode === 'cutout') {
    const th = bh * zoom;
    const s = th / img.height;
    const w = img.width * s;
    const vx0 = Math.max(x0, 0), vx1 = Math.min(x1, W);
    const px = (vx0 + vx1) / 2 - w / 2 + shiftX * bw;
    const py = y1 - th + shiftY * bh;
    ctx.drawImage(img, px, py, w, th);
    return;
  }

  const off = document.createElement('canvas');
  off.width = Math.round(bw); off.height = Math.round(bh);
  const o = off.getContext('2d');
  const s = Math.max(bw / img.width, bh / img.height) * zoom;
  const dw = img.width * s, dh = img.height * s;
  const cx = dw / 2 - shiftX * bw;
  const cy = dh * 0.42 - shiftY * bh;
  let left = bw / 2 - cx, top = bh / 2 - cy;
  left = Math.min(0, Math.max(bw - dw, left));
  top = Math.min(0, Math.max(bh - dh, top));
  o.imageSmoothingQuality = 'high';
  o.drawImage(img, left, top, dw, dh);

  // omeksani rubovi
  o.globalCompositeOperation = 'destination-in';
  const fade = Math.min(0.16 * bw, 0.16 * bh);
  const mk = (x0_, y0_, x1_, y1_) => {
    const g = o.createLinearGradient(x0_, y0_, x1_, y1_);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    return g;
  };
  o.fillStyle = mk(0, 0, fade, 0);
  o.fillRect(0, 0, fade, bh);
  o.fillStyle = mk(0, 0, 0, fade * 0.8);
  o.fillRect(0, 0, bw, fade * 0.8);
  if (y1 < H - 1) {
    o.fillStyle = mk(0, bh, 0, bh - fade * 0.8);
    o.fillRect(0, bh - fade * 0.8, bw, fade * 0.8);
  }
  o.globalCompositeOperation = 'source-over';
  ctx.drawImage(off, x0, y0);
}

function drawPlaceholder(ctx, W, H, box) {
  const [x0, y0, x1, y1] = box;
  const vx0 = Math.max(x0, 0), vx1 = Math.min(x1, W);
  const vy0 = Math.max(y0, 0), vy1 = Math.min(y1, H);
  const cx = (vx0 + vx1) / 2, vh = vy1 - vy0;
  const t = Math.min(x1 - x0, y1 - y0) * 0.05;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = Math.max(2, (y1 - y0) * 0.0035);
  [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(([px, py, dx, dy]) => {
    if (px < 0 || px > W || py < 0 || py > H) return;
    ctx.beginPath();
    ctx.moveTo(px + dx * t, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * t);
    ctx.stroke();
  });
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  const hr = vh * 0.115, hy = vy0 + vh * 0.30;
  ctx.beginPath(); ctx.arc(cx, hy, hr, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx, hy + hr * 0.42 + hr * 2.2, hr * 1.45, hr * 2.2, 0, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.40)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = fnt(500, vh * 0.040);
  ctx.fillText('FOTO GOVORNIKA', cx, vy0 + vh * 0.66);
  ctx.font = fnt(400, vh * 0.030);
  ctx.fillStyle = 'rgba(255,255,255,0.30)';
  ctx.fillText('dodaj fotografiju lijevo', cx, vy0 + vh * 0.715);
  ctx.restore();
}

/* -------------------------------------------------------------- kartica */
function renderCard(canvas, fmtName, data, assets) {
  const f = FORMATS[fmtName], L = LAYOUT[f.kind];
  const W = f.W, H = f.H;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const ml = L.ml * W;

  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx, W, H);
  drawNetwork(ctx, W, H, hashStr(data.name || 'cro') % 100000);

  const box = [L.photo[0] * W, L.photo[1] * H, L.photo[2] * W, L.photo[3] * H];
  if (data.photo) drawPhoto(ctx, W, H, box, data.photo, data.photoMode,
                            data.zoom, data.shiftX, data.shiftY);
  else drawPlaceholder(ctx, W, H, box);

  drawPlane(ctx, W, H, L.plane);

  /* --- logo --- */
  const logoW = L.logoW * W;
  const cc = assets.cro;
  const ccH = cc.height * logoW / cc.width;
  const top = L.logoY * H;
  ctx.drawImage(cc, ml, top, logoW, ccH);

  const rowH = ccH * 0.255;
  const pb = assets.pb, ic = assets.icon, sw = assets.word;
  const pbH = rowH * 0.62, pbW = pb.width * pbH / pb.height;
  const swH = rowH * 0.80, swW = sw.width * swH / sw.height;
  const gap = rowH * 0.30;
  let rx = ml + logoW - (pbW + gap + rowH + gap * 0.75 + swW);
  const ry = top + ccH + rowH * 0.42;
  ctx.drawImage(pb, rx, ry + (rowH - pbH) / 2, pbW, pbH); rx += pbW + gap;
  ctx.drawImage(ic, rx, ry, rowH, rowH);                  rx += rowH + gap * 0.75;
  ctx.drawImage(sw, rx, ry + (rowH - swH) * 0.55, swW, swH);

  /* --- datum --- */
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let fs = L.badgeFs * W;
  ctx.font = fnt(700, fs);
  const tw = ctx.measureText(data.date).width;
  const bh = L.badgeH * H, bw = tw + fs * 1.24, by = L.badgeY * H;
  ctx.fillStyle = C.yellow;
  ctx.fillRect(ml, by, bw, bh);
  ctx.fillStyle = C.white;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(data.date, ml + bw / 2, by + bh / 2 + fs * 0.045);

  /* --- ime --- */
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.white;
  const baseFs = L.nameFs * W, maxW = L.nameMax * W;
  let size = Math.min(baseFs, fitSize(ctx, data.name, 800, maxW, baseFs, 8));
  if (size < baseFs * 0.72 && data.name.trim().split(/\s+/).length > 1) {
    const words = data.name.trim().split(/\s+/);
    let best = null, score = 1e9;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      if (Math.abs(a.length - b.length) < score) { score = Math.abs(a.length - b.length); best = [a, b]; }
    }
    const longest = best[0].length > best[1].length ? best[0] : best[1];
    size = Math.min(baseFs * 0.82, fitSize(ctx, longest, 800, maxW, baseFs, 8));
    ctx.font = fnt(800, size);
    const lh = size * 1.02;
    ctx.fillText(best[0], ml, L.nameY * H - lh);
    ctx.fillText(best[1], ml, L.nameY * H);
  } else {
    ctx.font = fnt(800, size);
    ctx.fillText(data.name, ml, L.nameY * H);
  }

  /* --- tvrtka --- */
  if (data.company) {
    let cfs = L.compFs * W;
    const track = L.compTrack * W;
    ctx.font = fnt(400, cfs);
    while (trackedWidth(ctx, data.company, track) > L.divW * W && cfs > 6) {
      cfs *= 0.94; ctx.font = fnt(400, cfs);
    }
    trackedText(ctx, data.company, ml + 2, L.compY * H, track);
  }

  /* --- naslov predavanja --- */
  if (data.talk) {
    const base = L.talkFs * W;
    const r = wrapTo(ctx, data.talk, 500, L.talkMax * W, L.talkLines, base, base * 0.62);
    ctx.font = fnt(500, r.fs);
    let y = L.talkY * H;
    for (const line of r.lines) { ctx.fillText(line, ml + 2, y); y += r.fs * L.talkLh; }
  }

  /* --- crta --- */
  const lw = Math.max(1, Math.round(W / 750));
  ctx.fillStyle = C.white;
  ctx.fillRect(ml + 8, L.divY * H, L.divW * W - 8, lw);

  /* --- footer --- */
  const labY = L.labY * H, fooY = L.fooY * H, fooH = L.fooH * H;
  const col1 = ml + 8;
  ctx.font = fnt(400, L.labFs * W);
  ctx.fillText('Organizator', col1, labY);
  const ec = assets.ecom;
  const ecW = ec.width * fooH / ec.height;
  ctx.drawImage(ec, col1, fooY - fooH, ecW, fooH);

  if (data.slogan) {
    const col2 = col1 + ecW + W * 0.022;
    let right = ml + L.divW * W;
    if (L.photo[3] * H > L.divY * H) right = Math.min(right, L.photo[0] * W - W * 0.020);
    const avail = Math.max(right - col2, W * 0.12);
    const base = L.sloganFs * W;
    const r = wrapTo(ctx, data.slogan, 500, avail, 2, base, base * 0.60);
    ctx.font = fnt(500, r.fs);
    const lh = r.fs * 1.28;
    const centre = fooY - fooH * 0.55;
    let y = centre - (r.lines.length - 1) * lh / 2 + r.fs * 0.34;
    for (const line of r.lines) { ctx.fillText(line, col2, y); y += lh; }
  }
}
</script>
<script>/* CRO Commerce generator - sucelje ------------------------------------- */

const ASSET_KEYS = { cro: 'cro', pb: 'pb', icon: 'icon', word: 'word', ecom: 'ecom' };
const assets = {};
let ready = false;

const state = {
  name: 'Ime Prezime',
  company: 'NAZIV TVRTKE',
  talk: '',
  date: '13.10.2026.',
  slogan: 'Najveće okupljanje web trgovaca u regiji',
  photo: null,
  photoMode: 'auto',
  zoom: 1,
  shiftX: 0,
  shiftY: 0
};

let current = 'landscape';
let batch = [];            // {ime, tvrtka, predavanje, foto, img}
let photoFiles = {};       // naziv datoteke -> File

const $ = sel => document.querySelector(sel);
const preview = $('#preview');
const work = document.createElement('canvas');

/* ------------------------------------------------------------ ucitavanje */
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}

async function boot() {
  for (const k of Object.keys(ASSET_KEYS)) assets[k] = await loadImage(EMBEDDED[k]);
  try {
    await Promise.all(['400 40px Poppins', '500 40px Poppins',
                       '700 40px Poppins', '800 40px Poppins']
                      .map(f => document.fonts.load(f)));
    await document.fonts.ready;
  } catch (e) {}
  ready = true;
  buildTabs();
  bindInputs();
  draw();
}

/* ----------------------------------------------------------------- crtanje */
let drawTimer = null;
function draw() {
  if (!ready) return;
  clearTimeout(drawTimer);
  drawTimer = setTimeout(() => {
    try {
      renderCard(work, current, state, assets);
      const f = FORMATS[current];
      preview.width = f.W; preview.height = f.H;
      preview.getContext('2d').drawImage(work, 0, 0);
      preview.style.aspectRatio = `${f.W} / ${f.H}`;
      $('#dims').textContent = `${f.W} × ${f.H}`;
    } catch (err) {
      console.error('draw()', err);
      setStatus('Greška pri crtanju: ' + (err && err.message || err));
    }
  }, 16);
}

function buildTabs() {
  const wrap = $('#tabs');
  wrap.innerHTML = '';
  for (const [k, f] of Object.entries(FORMATS)) {
    const b = document.createElement('button');
    b.className = 'tab' + (k === current ? ' on' : '');
    b.innerHTML = `<strong>${k}</strong><span>${f.W}×${f.H}</span>`;
    b.title = f.label;
    b.onclick = () => {
      current = k;
      [...wrap.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      draw();
    };
    wrap.appendChild(b);
  }
}

function bindInputs() {
  const map = {
    '#ime': 'name', '#tvrtka': 'company', '#predavanje': 'talk',
    '#datum': 'date', '#slogan': 'slogan'
  };
  for (const [sel, key] of Object.entries(map)) {
    const el = $(sel);
    el.value = state[key];
    el.addEventListener('input', () => { state[key] = el.value; draw(); });
  }
  $('#mode').addEventListener('change', e => { state.photoMode = e.target.value; draw(); });
  for (const [sel, key] of [['#zoom', 'zoom'], ['#pomakx', 'shiftX'], ['#pomaky', 'shiftY']]) {
    const el = $(sel);
    el.addEventListener('input', () => {
      state[key] = parseFloat(el.value);
      el.nextElementSibling.textContent = (+el.value).toFixed(2);
      draw();
    });
  }
  $('#foto').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) usePhotoFile(f).then(draw).catch(photoErr);
  });
  $('#reset-foto').onclick = () => {
    state.photo = null; $('#foto').value = ''; $('#foto-ime').textContent = 'nema fotografije';
    draw();
  };

  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('hot');
  }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('hot');
  }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f) usePhotoFile(f).then(draw).catch(photoErr);
  });

  $('#dl-one').onclick = () => downloadOne();
  $('#dl-all').onclick = () => downloadAll();
  $('#csv').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) f.text().then(t => loadBatch(t));
  });
  $('#mapa').addEventListener('change', e => {
    photoFiles = {};
    for (const f of e.target.files) photoFiles[f.name.toLowerCase()] = f;
    $('#mapa-info').textContent = `${e.target.files.length} datoteka učitano`;
    matchBatchPhotos();
  });
  $('#dl-batch').onclick = () => downloadBatch();
}

function photoErr(err) {
  console.error('usePhotoFile', err);
  setStatus('Slika se nije učitala: ' + (err && err.message || err || 'nepoznata greška'));
}

async function usePhotoFile(file) {
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  img.hasAlpha = await detectAlpha(img);
  state.photo = img;
  $('#foto-ime').textContent = file.name + (img.hasAlpha ? '  (prozirna pozadina)' : '');
}

function detectAlpha(img) {
  try {
  const c = document.createElement('canvas');
  const n = 80;
  c.width = n; c.height = Math.max(1, Math.round(n * img.height / img.width));
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  return false;
  } catch (e) { return false; }
}

/* ------------------------------------------------------------- preuzimanje */
function slugify(s) {
  return (s || 'govornik').normalize('NFKD')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'govornik';
}

function canvasBlob(canvas, jpg) {
  return new Promise(res => canvas.toBlob(res, jpg ? 'image/jpeg' : 'image/png', 0.92));
}

function saveBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function downloadOne() {
  const jpg = $('#jpg').checked;
  renderCard(work, current, state, assets);
  const b = await canvasBlob(work, jpg);
  saveBlob(b, `${slugify(state.name)}-${current}.${jpg ? 'jpg' : 'png'}`);
}

function chosenFormats() {
  const on = [...document.querySelectorAll('.fmt:checked')].map(c => c.value);
  return on.length ? on : Object.keys(FORMATS);
}

async function downloadAll() {
  const jpg = $('#jpg').checked;
  const zip = new ZipWriter();
  setStatus('Renderiram…');
  for (const f of chosenFormats()) {
    renderCard(work, f, state, assets);
    const b = await canvasBlob(work, jpg);
    zip.add(`${slugify(state.name)}-${f}.${jpg ? 'jpg' : 'png'}`, new Uint8Array(await b.arrayBuffer()));
  }
  saveBlob(zip.blob(), `${slugify(state.name)}.zip`);
  setStatus('');
}

/* ------------------------------------------------------------------ batch */
function parseCSV(text) {
  text = text.replace(/^\ufeff/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim())).map(r => {
    const o = {};
    head.forEach((h, i) => o[h] = (r[i] || '').trim());
    return o;
  });
}

function pick(o, ...keys) { for (const k of keys) if (o[k]) return o[k]; return ''; }

function loadBatch(text) {
  batch = parseCSV(text).map(r => ({
    name: pick(r, 'ime', 'name', 'govornik'),
    company: pick(r, 'tvrtka', 'company', 'firma'),
    talk: pick(r, 'predavanje', 'naslov', 'tema', 'talk'),
    date: pick(r, 'datum', 'date') || state.date,
    foto: pick(r, 'foto', 'fotka', 'slika', 'photo'),
    zoom: parseFloat(pick(r, 'zoom')) || 1,
    shiftX: parseFloat(pick(r, 'pomak_x')) || 0,
    shiftY: parseFloat(pick(r, 'pomak_y')) || 0,
    img: null
  })).filter(r => r.name);
  matchBatchPhotos();
}

function findPhoto(row) {
  const cands = [];
  if (row.foto) cands.push(row.foto.toLowerCase());
  const stem = slugify(row.name);
  for (const ext of ['png', 'jpg', 'jpeg', 'webp']) cands.push(`${stem}.${ext}`);
  for (const c of cands) if (photoFiles[c]) return photoFiles[c];
  return null;
}

async function matchBatchPhotos() {
  const list = $('#lista');
  list.innerHTML = '';
  let missing = 0;
  for (const row of batch) {
    const file = findPhoto(row);
    if (file && (!row.img || row.imgName !== file.name)) {
      const img = await loadImage(URL.createObjectURL(file));
      img.hasAlpha = await detectAlpha(img);
      row.img = img; row.imgName = file.name;
    }
    if (!file) { row.img = null; missing++; }
    const li = document.createElement('button');
    li.className = 'row' + (file ? '' : ' warn');
    li.innerHTML = `<strong>${row.name}</strong><span>${file ? row.imgName : 'nema fotografije'}</span>`;
    li.onclick = () => {
      Object.assign(state, {
        name: row.name, company: row.company, talk: row.talk, date: row.date,
        photo: row.img, zoom: row.zoom, shiftX: row.shiftX, shiftY: row.shiftY
      });
      $('#ime').value = row.name; $('#tvrtka').value = row.company;
      $('#predavanje').value = row.talk; $('#datum').value = row.date;
      $('#foto-ime').textContent = row.img ? row.imgName : 'nema fotografije';
      draw();
    };
    list.appendChild(li);
  }
  $('#batch-info').textContent = batch.length
    ? `${batch.length} govornika${missing ? `, ${missing} bez fotografije` : ''}`
    : '';
  $('#dl-batch').disabled = !batch.length;
}

async function downloadBatch() {
  if (!batch.length) return;
  const jpg = $('#jpg').checked;
  const fmts = chosenFormats();
  const zip = new ZipWriter();
  let i = 0;
  for (const row of batch) {
    i++;
    setStatus(`${i}/${batch.length} — ${row.name}`);
    await new Promise(r => setTimeout(r, 0));
    const d = {
      name: row.name, company: row.company, talk: row.talk, date: row.date,
      slogan: state.slogan, photo: row.img, photoMode: state.photoMode,
      zoom: row.zoom, shiftX: row.shiftX, shiftY: row.shiftY
    };
    for (const f of fmts) {
      renderCard(work, f, d, assets);
      const b = await canvasBlob(work, jpg);
      zip.add(`${slugify(row.name)}/${slugify(row.name)}-${f}.${jpg ? 'jpg' : 'png'}`,
              new Uint8Array(await b.arrayBuffer()));
    }
  }
  setStatus('Pakiram zip…');
  await new Promise(r => setTimeout(r, 30));
  saveBlob(zip.blob(), 'cro-commerce-kartice.zip');
  setStatus('');
}

function setStatus(t) { $('#status').textContent = t; }

/* --------------------------------------------------------------- mini zip */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

class ZipWriter {
  constructor() { this.files = []; }
  add(name, bytes) {
    this.files.push({ name: new TextEncoder().encode(name), bytes, crc: crc32(bytes) });
  }
  blob() {
    const parts = [];
    const central = [];
    let offset = 0;
    for (const f of this.files) {
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true);
      h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0, true);
      h.setUint32(14, f.crc, true);
      h.setUint32(18, f.bytes.length, true);
      h.setUint32(22, f.bytes.length, true);
      h.setUint16(26, f.name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), f.name, f.bytes);

      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true);
      c.setUint16(4, 20, true); c.setUint16(6, 20, true);
      c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, 0, true); c.setUint16(14, 0, true);
      c.setUint32(16, f.crc, true);
      c.setUint32(20, f.bytes.length, true);
      c.setUint32(24, f.bytes.length, true);
      c.setUint16(28, f.name.length, true);
      c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), f.name);
      offset += 30 + f.name.length + f.bytes.length;
    }
    let cdSize = 0;
    for (const p of central) cdSize += p.length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, this.files.length, true);
    end.setUint16(10, this.files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)],
                    { type: 'application/zip' });
  }
}

boot().catch(err => {
  console.error('boot()', err);
  setStatus('Greška pri pokretanju alata: ' + (err && err.message || err));
});
